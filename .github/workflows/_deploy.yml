name: Deploy (één omgeving)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub-environment en Azure-omgeving (test of production)
        required: true
        type: string
      domain:
        description: Eigen domein voor deze omgeving (leeg = geen)
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || format('gastouder-{0}-rg', inputs.environment) }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastructuur (Bicep)
        id: infra
        env:
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$ALLOWED_USERS" ]; then echo "::error::Stel de variabele ALLOWED_USERS in voor environment $ENVIRONMENT."; exit 1; fi
          if [ "$(az group exists -n "$RESOURCE_GROUP")" != "true" ]; then az group create -n "$RESOURCE_GROUP" -l "$LOCATION" -o none; fi
          out=$(az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep \
                  -p allowedUsers="$ALLOWED_USERS" environmentName="$ENVIRONMENT" location="$LOCATION" \
                  --query properties.outputs -o json)
          {
            echo "static_web_app=$(jq -r .staticWebAppName.value <<<"$out")"
            echo "frontend_url=$(jq -r .frontendUrl.value <<<"$out")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # De API draait als managed functions in de Static Web App: stage alleen wat de runtime nodig heeft
      # (geen tests, geen dev-dependencies zoals azurite) en lever het vooraf gebouwd aan.
      - name: API klaarzetten
        run: |
          mkdir api
          cp -r backend/src backend/host.json backend/package.json backend/package-lock.json api/
          npm ci --omit=dev --prefix api
          du -sh api

      - name: Deployment-token Static Web App ophalen
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${{ steps.infra.outputs.static_web_app }}" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Frontend uitrollen (Static Web App)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend
          api_location: api
          skip_app_build: true

      # DNS staat bij de registrar en wordt handmatig beheerd. Deze stap koppelt het domein aan de Static Web App
      # (idempotent) en zet in de samenvatting welke records nog nodig zijn. Hij laat de deploy nooit falen.
      - name: Eigen domein koppelen
        if: inputs.domain != ''
        env:
          DOMAIN: ${{ inputs.domain }}
          SWA: ${{ steps.infra.outputs.static_web_app }}
        run: |
          default_host=$(az staticwebapp show -n "$SWA" -g "$RESOURCE_GROUP" --query defaultHostname -o tsv)
          ip=$(az staticwebapp show -n "$SWA" -g "$RESOURCE_GROUP" --query "stableInboundIP || stableInboundIp" -o tsv 2>/dev/null || true)
          # Twee labels (gastouderuren.nl) is een kaal domein; meer (test.gastouderuren.nl) een subdomein.
          if [ "$(awk -F. '{print NF}' <<<"$DOMAIN")" -le 2 ]; then apex=1; else apex=0; fi
          status() { az staticwebapp hostname list -n "$SWA" -g "$RESOURCE_GROUP" --query "[?name=='$DOMAIN'] | [0].status" -o tsv 2>/dev/null; }

          err=""
          if [ -z "$(status)" ]; then
            if [ "$apex" = 1 ]; then method="--validation-method dns-txt-token"; else method=""; fi
            # shellcheck disable=SC2086
            err=$(az staticwebapp hostname set -n "$SWA" -g "$RESOURCE_GROUP" --hostname "$DOMAIN" $method --no-wait 2>&1 >/dev/null) || true
          fi
          st=$(status)

          {
            echo ""
            echo "### Eigen domein: $DOMAIN"
            echo "Status: **${st:-nog niet gekoppeld}**"
            if [ -n "$err" ] && [ -z "$st" ]; then echo ""; echo "Koppelen is nog niet gelukt: \`$err\`"; fi
            if [ "$st" = "Ready" ]; then
              echo ""; echo "Het domein is gekoppeld en werkt met HTTPS."
            else
            echo ""
            echo "DNS-records bij je registrar:"
            if [ "$apex" = 1 ]; then
              token=$(az staticwebapp hostname show -n "$SWA" -g "$RESOURCE_GROUP" --hostname "$DOMAIN" --query validationToken -o tsv 2>/dev/null || true)
              echo "1. \`TXT\` op \`@\` met waarde \`${token:-(nog niet beschikbaar: draai de workflow opnieuw)}\`"
              echo "2. \`ALIAS\`/\`ANAME\` op \`@\` naar \`$default_host\`${ip:+, of een \`A\`-record op \`@\` naar \`$ip\`}"
            else
              echo "1. \`CNAME\` op \`${DOMAIN%%.*}\` naar \`$default_host\`"
            fi
            echo ""
            echo "Draai de workflow opnieuw nadat de records staan; zodra de status *Ready* is, werkt het domein met HTTPS."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$st" != "Ready" ]; then echo "::warning::Domein $DOMAIN is nog niet klaar (status: ${st:-niet gekoppeld}); zie de samenvatting voor de DNS-records."; fi

      - name: Samenvatting
        run: |
          echo "### ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ${{ steps.infra.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
