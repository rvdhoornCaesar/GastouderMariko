name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'gastouder-rg' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Infrastructuur (Bicep)
        id: infra
        env:
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
        run: |
          if [ -z "$ALLOWED_USERS" ]; then echo "::error::Stel de repository-variabele ALLOWED_USERS in."; exit 1; fi
          az group create -n "$RESOURCE_GROUP" -l "$LOCATION" -o none
          out=$(az deployment group create -g "$RESOURCE_GROUP" -f infra/main.bicep \
                  -p allowedUsers="$ALLOWED_USERS" location="$LOCATION" \
                  --query properties.outputs -o json)
          {
            echo "function_app=$(jq -r .functionAppName.value <<<"$out")"
            echo "static_web_app=$(jq -r .staticWebAppName.value <<<"$out")"
            echo "frontend_url=$(jq -r .frontendUrl.value <<<"$out")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend bouwen
        working-directory: backend
        run: npm ci --omit=dev

      - name: Backend uitrollen (Function App)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.function_app }}
          package: backend
          respect-funcignore: true

      - name: Deployment-token Static Web App ophalen
        id: swa
        run: |
          token=$(az staticwebapp secrets list -n "${{ steps.infra.outputs.static_web_app }}" -g "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Frontend uitrollen (Static Web App)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend
          skip_app_build: true
          skip_api_build: true

      - name: Samenvatting
        run: |
          echo "Frontend: ${{ steps.infra.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
